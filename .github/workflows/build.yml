name: Build PurpouPanel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Theos
        uses: Randomblock1/theos-action@v1

      - name: Compilar pacote
        run: make package FINALPACKAGE=1

      - name: Extrair a dylib do pacote
        run: |
          set -e
          mkdir -p dist/unpacked
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" dist/unpacked
          DYLIB="$(find dist/unpacked -type f -name 'PurpouPanel.dylib' | head -n 1)"
          test -n "$DYLIB"
          cp "$DYLIB" dist/PurpouPanel.dylib
          cp "$DEB" dist/PurpouPanel.deb

      - name: Disponibilizar arquivos para baixar
        uses: actions/upload-artifact@v4
        with:
          name: PurpouPanel-build
          path: dist/*
          if-no-files-found: error
